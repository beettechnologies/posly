groups:
  - name: posly-server-alerts
    rules:
      - alert: PoslyAuth5xxRateHigh
        expr: sum(rate(ktor_http_server_requests_seconds_count{route=~"/auth.*",status=~"5.."}[5m])) > 0.2
        for: 10m
        labels:
          severity: page
          service: posly-auth
        annotations:
          summary: "Auth service 5xx rate is above threshold"
          description: "Auth endpoints are returning elevated 5xx responses for 10m."
          runbook_url: "https://github.com/beettechnologies/posly/blob/main/docs/runbooks/observability-alerts.md"

      - alert: PoslyAuthP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(ktor_http_server_requests_seconds_bucket{route=~"/auth.*"}[5m])) by (le)) > 1.0
        for: 15m
        labels:
          severity: warning
          service: posly-auth
        annotations:
          summary: "Auth p95 latency is above 1s"
          description: "Auth endpoint p95 latency has remained above 1 second for 15m."
          runbook_url: "https://github.com/beettechnologies/posly/blob/main/docs/runbooks/observability-alerts.md"

      - alert: PoslyPayments5xxRateHigh
        expr: sum(rate(ktor_http_server_requests_seconds_count{route=~"/payments.*",status=~"5.."}[5m])) > 0.1
        for: 10m
        labels:
          severity: page
          service: posly-payments
        annotations:
          summary: "Payments service 5xx rate is above threshold"
          description: "Payments endpoints are returning elevated 5xx responses for 10m."
          runbook_url: "https://github.com/beettechnologies/posly/blob/main/docs/runbooks/observability-alerts.md"

      - alert: PoslyNoTracesExported
        expr: increase(otel_exporter_sent_spans[10m]) == 0
        for: 15m
        labels:
          severity: warning
          service: posly-server
        annotations:
          summary: "No traces exported from Posly server"
          description: "No spans were exported in the last 10m; check OTLP endpoint and credentials."
          runbook_url: "https://github.com/beettechnologies/posly/blob/main/docs/runbooks/observability-alerts.md"

      - alert: PoslyHeavyAnalyticsRateLimited
        expr: sum(rate(ktor_http_server_requests_seconds_count{route=~"/reports/pipeline.*|/finance/reports/generate|/finance/reports/schedules/.*/run-now",status="429"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: posly-reporting
        annotations:
          summary: "Heavy analytics endpoints are being rate-limited"
          description: "The shared heavy-analytics token bucket (5 calls/min, see com.beettechnologies.posly.capacity.HeavyAnalyticsRateLimit) has been rejecting requests with 429 for 5m - either a caller is retrying too aggressively, or genuine reporting demand now exceeds the bucket's cap and it may need raising."
          runbook_url: "https://github.com/beettechnologies/posly/blob/main/docs/runbooks/capacity-scale-incidents.md"

      - alert: PoslyHeavyAnalyticsKillSwitchActive
        expr: sum(rate(ktor_http_server_requests_seconds_count{route=~"/reports/pipeline.*|/finance/reports/generate|/finance/reports/schedules/.*/run-now",status="503"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          service: posly-reporting
        annotations:
          summary: "The heavy-analytics kill switch is currently blocking requests"
          description: "Heavy reporting/finance endpoints are returning 503 for 5m, meaning the heavy_analytics_pipeline feature flag is currently disabled (see docs/runbooks/capacity-scale-incidents.md). If this wasn't an intentional, ongoing capacity response, re-enable the flag."
          runbook_url: "https://github.com/beettechnologies/posly/blob/main/docs/runbooks/capacity-scale-incidents.md"

      - alert: PoslyTerminalsOffline
        expr: posly_printers_offline + posly_devices_offline > 0
        for: 10m
        labels:
          severity: page
          service: posly-terminals
        annotations:
          summary: "One or more store terminals/printers have been offline for 10+ minutes"
          description: "posly_printers_offline (explicitly set OFFLINE) and/or posly_devices_offline (no heartbeat in 5m, see HEARTBEAT_OFFLINE_THRESHOLD_SECONDS) is nonzero. Check GET /printers and GET /devices to identify which store/device."
          runbook_url: "https://github.com/beettechnologies/posly/blob/main/docs/runbooks/terminal-offline.md"
