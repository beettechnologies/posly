ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ com.beettechnologies.posly.ApplicationKt.module ]
    }
}

jwt {
    secret = "change-me-in-production-use-at-least-32-chars!!"
    issuer = "posly"
    audience = "posly-api"
    accessTokenExpirationMs = 900000
    refreshTokenExpirationMs = 604800000
    mfaTokenExpirationMs = 300000
}

observability {
    serviceName = "posly-server"
    environment = ${?ENVIRONMENT}
}

payments {
    webhookSecret = "change-me-in-production-use-a-long-random-secret"
}

# Defaults to an in-process H2 instance (Postgres-compatibility mode) so local dev and this
# sandbox run out of the box with zero external setup - point DATABASE_URL/USER/PASSWORD at a
# real PostgreSQL instance for an actual deployment.
database {
    jdbcUrl = "jdbc:h2:mem:posly-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    jdbcUrl = ${?DATABASE_URL}
    username = "sa"
    username = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}

backup {
    directory = "build/backups"
    directory = ${?BACKUP_DIRECTORY}
}
