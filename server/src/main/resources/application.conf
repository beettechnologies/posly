ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ com.beettechnologies.posly.ApplicationKt.module ]
    }
}

jwt {
    secret = "change-me-in-production-use-at-least-32-chars!!"
    secret = ${?JWT_SECRET}
    issuer = "posly"
    audience = "posly-api"
    accessTokenExpirationMs = 900000
    refreshTokenExpirationMs = 604800000
    mfaTokenExpirationMs = 300000
}

observability {
    serviceName = "posly-server"
    environment = ${?ENVIRONMENT}
}

payments {
    webhookSecret = "change-me-in-production-use-a-long-random-secret"
    webhookSecret = ${?PAYMENT_WEBHOOK_SECRET}
}

# Rotation grace period for the SecretsManager-backed secrets above (jwt.secret,
# payments.webhookSecret): how long a superseded secret version stays valid for verification after
# POST /ops/secrets/{name}/rotate, so in-flight tokens/signatures aren't invalidated mid-rotation.
secrets {
    rotationGracePeriodMs = 86400000
    rotationGracePeriodMs = ${?SECRET_ROTATION_GRACE_PERIOD_MS}
}

# Defaults to an in-process H2 instance (Postgres-compatibility mode) so local dev and this
# sandbox run out of the box with zero external setup - point DATABASE_URL/USER/PASSWORD at a
# real PostgreSQL instance for an actual deployment.
database {
    jdbcUrl = "jdbc:h2:mem:posly-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    jdbcUrl = ${?DATABASE_URL}
    username = "sa"
    username = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 10
}

backup {
    directory = "build/backups"
    directory = ${?BACKUP_DIRECTORY}
}

# Retention policy for the audit log: rows older than retentionDays are archived to
# archiveDirectory as JSON Lines and then purged, on a self-scheduling loop that checks every
# retentionCheckIntervalMs.
audit {
    retentionDays = 90
    retentionDays = ${?AUDIT_RETENTION_DAYS}
    retentionCheckIntervalMs = 86400000
    retentionCheckIntervalMs = ${?AUDIT_RETENTION_CHECK_INTERVAL_MS}
    archiveDirectory = "build/audit-archive"
    archiveDirectory = ${?AUDIT_ARCHIVE_DIRECTORY}
}
