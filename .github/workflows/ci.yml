name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon --continue

      - name: Run server tests
        run: ./gradlew :server:test --no-daemon

      - name: Run shared logic tests (JVM)
        run: ./gradlew :app:sharedLogic:jvmTest --no-daemon

      - name: Run core tests (JVM)
        run: ./gradlew :core:jvmTest --no-daemon
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build server fat JAR (for image scan)
        run: ./gradlew :server:buildFatJar --no-daemon -q

      - name: Build Docker image for scanning
        run: docker build -t posly-scan:${{ github.sha }} .

      - name: Run Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: posly-scan:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: always()
    steps:
      - name: All checks passed
        if: ${{ needs.lint-and-test.result == 'success' && needs.security-scan.result == 'success' }}
        run: echo "All CI checks passed."

      - name: Fail if any check failed
        if: ${{ needs.lint-and-test.result == 'failure' || needs.security-scan.result == 'failure' }}
        run: |
          echo "One or more CI checks failed."
          exit 1
