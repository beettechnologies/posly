name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon --continue

      - name: Run server tests
        run: ./gradlew :server:test --no-daemon

      - name: Run shared logic tests (JVM)
        run: ./gradlew :app:sharedLogic:jvmTest --no-daemon

      - name: Run core tests (JVM)
        run: ./gradlew :core:jvmTest --no-daemon
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  android-checks:
    name: Android A11y Tests & Bundle Size Budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform and build-tools
        run: sdkmanager "platforms;android-${{ env.COMPILE_SDK }}" "build-tools;${{ env.BUILD_TOOLS_VERSION }}"
        env:
          COMPILE_SDK: '36'
          BUILD_TOOLS_VERSION: '36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # app:sharedUI (the Compose UI module with every POS screen) is only included in the
      # Gradle build when ANDROID_HOME is set (see settings.gradle.kts) - without this job, its
      # tests, including the accessibility regression suite added alongside PERFORMANCE.md /
      # ACCESSIBILITY.md, never ran in CI at all.
      - name: Run sharedUI tests (includes accessibility regression suite)
        run: ./gradlew :app:sharedUI:jvmTest --no-daemon

      # See PERFORMANCE.md for how the budget was derived and app/androidApp/build.gradle.kts
      # for the task itself - this is the native equivalent of a web app's Lighthouse/bundle-size
      # CI gate.
      - name: Enforce release APK size budget
        run: ./gradlew :app:androidApp:checkApkSizeBudget --no-daemon

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/sharedUI/build/reports/tests/
            app/sharedUI/build/test-results/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build server fat JAR (for image scan)
        run: ./gradlew :server:buildFatJar --no-daemon -q

      - name: Build Docker image for scanning
        run: docker build -t posly-scan:${{ github.sha }} .

      - name: Run Trivy vulnerability scan (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: posly-scan:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    permissions: {}
    needs: [lint-and-test, android-checks, security-scan]
    if: always()
    steps:
      - name: All checks passed
        if: ${{ needs.lint-and-test.result == 'success' && needs.android-checks.result == 'success' && needs.security-scan.result == 'success' }}
        run: echo "All CI checks passed."

      - name: Fail if any check failed
        if: ${{ needs.lint-and-test.result == 'failure' || needs.android-checks.result == 'failure' || needs.security-scan.result == 'failure' }}
        run: |
          echo "One or more CI checks failed."
          exit 1
