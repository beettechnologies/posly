      responses:
        '200': { description: Printed or queued, content: { application/json: { schema: { $ref: '#/components/schemas/PrintJobResponse' } } } }
        '202': { description: Queued (printer offline), content: { application/json: { schema: { $ref: '#/components/schemas/PrintJobResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

