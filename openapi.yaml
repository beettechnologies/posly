        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /finance/reports/schedules/{id}:
    delete:
      tags: [Finance Reports]
      summary: Delete a finance report schedule (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /finance/reports/schedules/{id}/runs:
    get:
      tags: [Finance Reports]
      summary: List past runs of a schedule (ADMIN/MANAGER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Runs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ScheduledReportRunResponse' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /finance/reports/schedules/{id}/run-now:
    post:
      tags: [Finance Reports]
      summary: Immediately trigger an out-of-cycle schedule run (ADMIN, rate-limited)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Run triggered, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduledReportRunResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { description: Kill switch active, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ============================================================
  # Backups
  # ============================================================
  /ops/backups/run-now:
    post:
      tags: [Backups]
      summary: Trigger an immediate database backup (ADMIN)
      responses:
        '201': { description: Backup created, content: { application/json: { schema: { $ref: '#/components/schemas/BackupMetadataResponse' } } } }
        '500': { description: Backup failed, content: { application/json: { schema: { $ref: '#/components/schemas/BackupMetadataResponse' } } } }
  /ops/backups:
    get:
      tags: [Backups]
      summary: List all backups and their metadata (ADMIN)
      responses:
        '200': { description: Backups, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BackupMetadataResponse' } } } } }
  /ops/backups/{id}/restore:
    post:
      tags: [Backups]
      summary: Restore a backup into a non-production target database, as a DR drill (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/RestoreDrillResultResponse' } } } }
        '400': { description: Refused production target, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A user JWT access token from /auth/login (or /auth/mfa/verify, /auth/sso/callback).
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: "posly_<key-id>-<secret>"
      description: |
        An API key created via POST /api-keys, format posly_<key-id>-<secret>. Only accepted on
        routes that explicitly list apiKeyAuth as an alternative security requirement, and only
        within its granted scopes (ORDERS_READ, PRODUCTS_READ, REPORTS_READ). See API_KEYS.md.
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing/invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicting state (duplicate, wrong status, etc.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    # ---- Auth ----
    LoginRequest:
      type: object
      properties: { username: { type: string }, password: { type: string } }
      required: [username, password]
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string, nullable: true }
        refreshToken: { type: string, nullable: true }
        mfaRequired: { type: boolean, default: false }
        mfaToken: { type: string, nullable: true }
    RefreshRequest:
      type: object
      properties: { refreshToken: { type: string } }
      required: [refreshToken]
    RefreshResponse:
      type: object
      properties: { accessToken: { type: string } }
      required: [accessToken]
    LogoutRequest:
      type: object
      properties: { refreshToken: { type: string } }
      required: [refreshToken]
    MfaVerifyRequest:
      type: object
      properties: { mfaToken: { type: string }, code: { type: string } }
      required: [mfaToken, code]
    MfaVerifyResponse:
      type: object
      properties: { accessToken: { type: string }, refreshToken: { type: string } }
      required: [accessToken, refreshToken]
    MeResponse:
      type: object
      properties:
        userId: { type: string, nullable: true }
        roles: { type: array, items: { type: string } }
    SsoCallbackRequest:
      type: object
      properties:
        externalId: { type: string }
        email: { type: string }
        externalGroups: { type: array, items: { type: string }, default: [] }
      required: [externalId, email]
    SsoLoginResponse:
      type: object
      properties: { accessToken: { type: string }, refreshToken: { type: string } }

    # ---- Users ----
    UserResponse:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        storeIds: { type: array, items: { type: string } }
        status: { type: string }
        mfaEnabled: { type: boolean }
        roleVersion: { type: integer }
        externalId: { type: string, nullable: true }
    InviteUserRequest:
      type: object
      properties:
        username: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        storeIds: { type: array, items: { type: string }, default: [] }
      required: [username, email, roles]
    InviteUserResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/UserResponse' }
        inviteToken: { type: string }
        emailDelivered: { type: boolean }
    AcceptInviteRequest:
      type: object
      properties: { token: { type: string }, newPassword: { type: string } }
      required: [token, newPassword]
    UpdateRolesRequest:
      type: object
      properties: { roles: { type: array, items: { type: string } } }
      required: [roles]
    UpdateStoreAccessRequest:
      type: object
      properties: { storeIds: { type: array, items: { type: string } } }
      required: [storeIds]
    UpdateStatusRequest:
      type: object
      properties: { status: { type: string } }
      required: [status]
    AuditLogEntryResponse:
      type: object
      properties:
        id: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
        event: { type: string }
        username: { type: string, nullable: true }
        userId: { type: string, nullable: true }
        deviceId: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        remoteIp: { type: string, nullable: true }
        detail: { type: string, nullable: true }
    AuditRetentionResultResponse:
      type: object
      properties:
        id: { type: string }
        ranAt: { type: string, format: date-time }
        cutoff: { type: string, format: date-time }
        purgedCount: { type: integer }
        archiveFilePath: { type: string, nullable: true }
    SsoRoleMappingDto:
      type: object
      properties: { externalGroup: { type: string }, role: { type: string } }
    SsoConfigureRequest:
      type: object
      properties:
        providerName: { type: string }
        roleMappings: { type: array, items: { $ref: '#/components/schemas/SsoRoleMappingDto' } }
        defaultRoles: { type: array, items: { type: string } }
        enabled: { type: boolean, default: true }
    SsoConfigurationResponse:
      type: object
      properties:
        providerName: { type: string }
        enabled: { type: boolean }
        roleMappings: { type: array, items: { $ref: '#/components/schemas/SsoRoleMappingDto' } }
        defaultRoles: { type: array, items: { type: string } }
        configuredAt: { type: string, format: date-time }

    # ---- Devices ----
    CreatePairCodeRequest:
      type: object
      properties:
        storeId: { type: string }
        expiresInSeconds: { type: integer, nullable: true }
        terminalType: { type: string, nullable: true }
      required: [storeId]
    PairCodeResponse:
      type: object
      properties:
        code: { type: string }
        storeId: { type: string }
        expiresAt: { type: string, format: date-time }
        terminalType: { type: string, nullable: true }
    ValidatePairCodeRequest:
      type: object
      properties: { code: { type: string } }
      required: [code]
    ValidatePairCodeResponse:
      type: object
      properties:
        valid: { type: boolean }
        storeId: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    RevokePairCodeRequest:
      type: object
      properties: { code: { type: string } }
      required: [code]
    DeviceResponse:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        name: { type: string }
        terminalType: { type: string, nullable: true }
        enrolledAt: { type: string, format: date-time }
        status: { type: string }
        healthStatus: { type: string }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        deprovisionedAt: { type: string, format: date-time, nullable: true }
    EnrollDeviceRequest:
      type: object
      properties:
        code: { type: string }
        storeId: { type: string, nullable: true }
        name: { type: string, nullable: true }
      required: [code]
    EnrollDeviceResponse:
      type: object
      properties:
        deviceId: { type: string }
        storeId: { type: string }
        clientId: { type: string }
        clientSecret: { type: string }
    HeartbeatRequest:
      type: object
      properties: { clientId: { type: string }, clientSecret: { type: string } }
      required: [clientId, clientSecret]
    HeartbeatResponse:
      type: object
      properties: { status: { type: string }, lastSeenAt: { type: string, format: date-time } }

    # ---- API Keys ----
    CreateApiKeyRequest:
      type: object
      properties:
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [ORDERS_READ, PRODUCTS_READ, REPORTS_READ] } }
      required: [name, scopes]
    ApiKeyResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        keyPrefix: { type: string }
        scopes: { type: array, items: { type: string } }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedBy: { type: string, nullable: true }
    ApiKeyCreatedResponse:
      type: object
      properties:
        apiKey: { $ref: '#/components/schemas/ApiKeyResponse' }
        rawKey: { type: string, description: "Shown exactly once - never recoverable again." }
    ApiKeyUsageResponse:
      type: object
      properties:
        id: { type: string }
        method: { type: string }
        path: { type: string }
        statusCode: { type: integer }
        timestamp: { type: string, format: date-time }

    # ---- Secrets ----
    SecretVersionSummaryResponse:
      type: object
      properties:
        id: { type: string }
        issuedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [CURRENT, IN_GRACE_PERIOD, EXPIRED] }
    SecretSummaryResponse:
      type: object
      properties:
        name: { type: string }
        current: { $ref: '#/components/schemas/SecretVersionSummaryResponse' }
        history: { type: array, items: { $ref: '#/components/schemas/SecretVersionSummaryResponse' } }
    SecretRotationResponse:
      type: object
      properties:
        secretName: { type: string }
        newVersionId: { type: string }
        newValue: { type: string, description: "Shown exactly once." }
        issuedAt: { type: string, format: date-time }
        previousVersionGraceExpiresAt: { type: string, format: date-time, nullable: true }

    # ---- Feature Flags ----
    CreateFeatureFlagRequest:
      type: object
      properties:
        key: { type: string }
        description: { type: string }
        enabled: { type: boolean, default: false }
        rolloutPercentage: { type: integer, default: 0 }
      required: [key, description]
    UpdateFeatureFlagRequest:
      type: object
      properties:
        enabled: { type: boolean, nullable: true }
        rolloutPercentage: { type: integer, nullable: true }
        enabledStoreIds: { type: array, items: { type: string }, nullable: true }
    FeatureFlagResponse:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        rolloutPercentage: { type: integer }
        enabledStoreIds: { type: array, items: { type: string } }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    FlagEvaluationResponse:
      type: object
      properties:
        key: { type: string }
        storeId: { type: string }
        enabled: { type: boolean }
        reason: { type: string }

    # ---- Webhooks ----
    RegisterWebhookRequest:
      type: object
      properties:
        url: { type: string }
        secret: { type: string }
        eventTypes: { type: array, items: { type: string } }
      required: [url, secret, eventTypes]
    WebhookSubscriptionResponse:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        eventTypes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    WebhookDeliveryResponse:
      type: object
      properties:
        id: { type: string }
        subscriptionId: { type: string }
        eventType: { type: string }
        eventId: { type: string }
        status: { type: string }
        attempts: { type: integer }
        lastError: { type: string, nullable: true }
        lastStatusCode: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
        deadLetteredAt: { type: string, format: date-time, nullable: true }

    # ---- Tax Profiles / Tax ----
    TaxRateRequest:
      type: object
      properties:
        name: { type: string }
        ratePercent: { type: number }
        order: { type: integer, default: 0 }
        compoundsOnPrior: { type: boolean, default: false }
      required: [name, ratePercent]
    TaxRateResponse:
      type: object
      properties:
        name: { type: string }
        ratePercent: { type: number }
        order: { type: integer }
        compoundsOnPrior: { type: boolean }
    CreateTaxProfileRequest:
      type: object
      properties:
        name: { type: string }
        rates: { type: array, items: { $ref: '#/components/schemas/TaxRateRequest' } }
        pricingMode: { type: string, default: EXCLUSIVE }
        roundingMode: { type: string, default: HALF_UP }
      required: [name, rates]
    UpdateTaxProfileRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        rates: { type: array, items: { $ref: '#/components/schemas/TaxRateRequest' }, nullable: true }
        pricingMode: { type: string, nullable: true }
        roundingMode: { type: string, nullable: true }
    TaxProfileResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        rates: { type: array, items: { $ref: '#/components/schemas/TaxRateResponse' } }
        pricingMode: { type: string }
        roundingMode: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    CalculateTaxRequest:
      type: object
      properties: { amount: { type: number } }
      required: [amount]
    TaxBreakdownItem:
      type: object
      properties: { name: { type: string }, ratePercent: { type: number }, amount: { type: number } }
    CalculateTaxResponse:
      type: object
      properties:
        subtotal: { type: number }
        breakdown: { type: array, items: { $ref: '#/components/schemas/TaxBreakdownItem' } }
        totalTax: { type: number }
        total: { type: number }
    TaxCalculateLineRequest:
      type: object
      properties: { id: { type: string }, amount: { type: number }, taxCategory: { type: string } }
    TaxCalculateRequest:
      type: object
      properties:
        taxProfileId: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/TaxCalculateLineRequest' } }
      required: [taxProfileId, lines]
    TaxCalculateResponse:
      type: object
      properties:
        taxableAmount: { type: number }
        exemptAmount: { type: number }
        breakdown: { type: array, items: { $ref: '#/components/schemas/TaxBreakdownItem' } }
        totalTax: { type: number }
        total: { type: number }

    # ---- Products ----
    ModifierRequest:
      type: object
      properties: { name: { type: string }, options: { type: array, items: { type: string } } }
    ModifierResponse:
      type: object
      properties: { name: { type: string }, options: { type: array, items: { type: string } } }
    CreateProductRequest:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number }
        taxCategory: { type: string, default: STANDARD }
        modifiers: { type: array, items: { $ref: '#/components/schemas/ModifierRequest' }, default: [] }
        imageUrls: { type: array, items: { type: string }, default: [] }
        barcode: { type: string, nullable: true }
        category: { type: string, nullable: true }
        inStock: { type: boolean, default: true }
      required: [sku, name, price]
    CreateProductResponse:
      type: object
      properties: { id: { type: string } }
    UpdateProductRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        price: { type: number, nullable: true }
        taxCategory: { type: string, nullable: true }
        modifiers: { type: array, items: { $ref: '#/components/schemas/ModifierRequest' }, nullable: true }
        barcode: { type: string, nullable: true }
        category: { type: string, nullable: true }
        inStock: { type: boolean, nullable: true }
    ProductResponse:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: number }
        taxCategory: { type: string }
        modifiers: { type: array, items: { $ref: '#/components/schemas/ModifierResponse' } }
        imageUrls: { type: array, items: { type: string } }
        barcode: { type: string, nullable: true }
        category: { type: string, nullable: true }
        inStock: { type: boolean }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    ImageUploadResponse:
      type: object
      properties: { imageUrl: { type: string } }

    # ---- Product Import ----
    UploadCsvResponse:
      type: object
      properties:
        fileId: { type: string }
        headers: { type: array, items: { type: string } }
        previewRows: { type: array, items: { type: array, items: { type: string } } }
        totalRows: { type: integer }
    ImportMappingRequest:
      type: object
      properties: { mapping: { type: object, additionalProperties: { type: string } } }
    ImportRowOutcomeResponse:
      type: object
      properties:
        rowNumber: { type: integer }
        action: { type: string, enum: [CREATED, UPDATED, ERROR] }
        sku: { type: string, nullable: true }
        errors: { type: array, items: { type: string } }
    DryRunResponse:
      type: object
      properties: { outcomes: { type: array, items: { $ref: '#/components/schemas/ImportRowOutcomeResponse' } } }
    ImportJobResponse:
      type: object
      properties:
        id: { type: string }
        fileId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        totalRows: { type: integer }
        processedRows: { type: integer }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        erroredCount: { type: integer }
        rowOutcomes: { type: array, items: { $ref: '#/components/schemas/ImportRowOutcomeResponse' } }
        rolledBack: { type: boolean }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }

    # ---- Sales Import ----
    UploadSalesCsvResponse:
      type: object
      properties:
        fileId: { type: string }
        headers: { type: array, items: { type: string } }
        previewRows: { type: array, items: { type: array, items: { type: string } } }
        totalRows: { type: integer }
    SalesImportMappingRequest:
      type: object
      properties: { mapping: { type: object, additionalProperties: { type: string } } }
    SalesRowOutcomeResponse:
      type: object
      properties:
        rowNumber: { type: integer }
        orderReference: { type: string }
        result: { type: string, enum: [MATCHED, UNMATCHED] }
        sku: { type: string, nullable: true }
        errors: { type: array, items: { type: string } }
    SalesOrderGroupPreviewResponse:
      type: object
      properties:
        orderReference: { type: string }
        rowNumbers: { type: array, items: { type: integer } }
        importable: { type: boolean }
        itemCount: { type: integer }
        total: { type: number, nullable: true }
        errors: { type: array, items: { type: string } }
    SalesDryRunResponse:
      type: object
      properties:
        rowOutcomes: { type: array, items: { $ref: '#/components/schemas/SalesRowOutcomeResponse' } }
        groups: { type: array, items: { $ref: '#/components/schemas/SalesOrderGroupPreviewResponse' } }
    SalesImportedOrderResponse:
      type: object
      properties:
        orderReference: { type: string }
        orderId: { type: string }
        storeId: { type: string }
        total: { type: number }
        itemCount: { type: integer }
    SalesImportJobResponse:
      type: object
      properties:
        id: { type: string }
        fileId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
        totalRows: { type: integer }
        totalGroups: { type: integer }
        processedGroups: { type: integer }
        importedCount: { type: integer }
        skippedUnmatchedCount: { type: integer }
        skippedAlreadyImportedCount: { type: integer }
        rowOutcomes: { type: array, items: { $ref: '#/components/schemas/SalesRowOutcomeResponse' } }
        importedOrders: { type: array, items: { $ref: '#/components/schemas/SalesImportedOrderResponse' } }
        rolledBack: { type: boolean }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    SalesReconciliationReportResponse:
      type: object
      properties:
        jobId: { type: string }
        totalRowsProcessed: { type: integer }
        totalGroups: { type: integer }
        importedCount: { type: integer }
        skippedUnmatchedCount: { type: integer }
        skippedAlreadyImportedCount: { type: integer }
        sampleMappings: { type: array, items: { $ref: '#/components/schemas/SalesImportedOrderResponse' } }
        generatedAt: { type: string, format: date-time }

    # ---- Search ----
    SearchResultItem:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        price: { type: number }
        category: { type: string, nullable: true }
        inStock: { type: boolean }
        barcode: { type: string, nullable: true }
    SearchResponse:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/SearchResultItem' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    # ---- Stores ----
    AddressDto:
      type: object
      properties:
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string, nullable: true }
        postalCode: { type: string }
        country: { type: string }
      required: [line1, city, postalCode, country]
    CreateStoreRequest:
      type: object
      properties:
        name: { type: string }
        address: { $ref: '#/components/schemas/AddressDto' }
        timezone: { type: string }
        currency: { type: string }
        taxProfileId: { type: string, nullable: true }
        locale: { type: string, default: en-US }
      required: [name, address, timezone, currency]
    UpdateStoreRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        address: { $ref: '#/components/schemas/AddressDto' }
        timezone: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        taxProfileId: { type: string, nullable: true }
        locale: { type: string, nullable: true }
    StoreResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        address: { $ref: '#/components/schemas/AddressDto' }
        timezone: { type: string }
        currency: { type: string }
        locale: { type: string }
        taxProfileId: { type: string, nullable: true }
        logoUrl: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    LogoUploadResponse:
      type: object
      properties: { logoUrl: { type: string } }

    # ---- Inventory ----
    AdjustStockRequest:
      type: object
      properties:
        productId: { type: string }
        storeId: { type: string }
        delta: { type: integer }
        reason: { type: string }
      required: [productId, storeId, delta, reason]
    InventorySnapshotResponse:
      type: object
      properties:
        productId: { type: string }
        storeId: { type: string }
        onHand: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        version: { type: integer, format: int64 }
    InventoryTransactionResponse:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        storeId: { type: string }
        type: { type: string }
        quantity: { type: integer }
        referenceId: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        actorId: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
    ReserveRequest:
      type: object
      properties:
        productId: { type: string }
        storeId: { type: string }
        quantity: { type: integer }
        referenceId: { type: string }
      required: [productId, storeId, quantity, referenceId]
    ReservationResponse:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        storeId: { type: string }
        quantity: { type: integer }
        referenceId: { type: string }
        status: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }

    # ---- Stock Counts ----
    StockCountLineRequest:
      type: object
      properties: { productId: { type: string }, countedQuantity: { type: integer } }
    SubmitStockCountRequest:
      type: object
      properties:
        storeId: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/StockCountLineRequest' } }
      required: [storeId, lines]
    StockCountVarianceResponse:
      type: object
      properties:
        productId: { type: string }
        expectedQuantity: { type: integer }
        countedQuantity: { type: integer }
        delta: { type: integer }
        cause: { type: string }
        probableCause: { type: string }
        suggestedAdjustment: { type: integer }
        adjustmentTransactionId: { type: string, nullable: true }
    StockCountResponse:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        variances: { type: array, items: { $ref: '#/components/schemas/StockCountVarianceResponse' } }
        countedBy: { type: string, nullable: true }
        countedAt: { type: integer, format: int64 }
        hasVariance: { type: boolean }
        totalVarianceUnits: { type: integer }

    # ---- Shifts ----
    OpenShiftRequest:
      type: object
      properties: { storeId: { type: string }, openingFloat: { type: number } }
      required: [storeId, openingFloat]
    CloseShiftRequest:
      type: object
      properties:
        closingCount: { type: number }
        note: { type: string, nullable: true }
      required: [closingCount]
    ShiftResponse:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        cashierId: { type: string, nullable: true }
        openingFloat: { type: number }
        openedAt: { type: string, format: date-time }
        status: { type: string }
        closingCount: { type: number, nullable: true }
        expectedCash: { type: number, nullable: true }
        variance: { type: number, nullable: true }
        varianceCause: { type: string, nullable: true }
        possibleReasons: { type: array, items: { type: string } }
        note: { type: string, nullable: true }
        closedBy: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
    RequiresOverrideOrNoteResponse:
      type: object
      properties:
        error: { type: string }
        variance: { type: number }
        threshold: { type: number }
    ExpectedCashResponse:
      type: object
      properties: { expectedCash: { type: number }, asOf: { type: string, format: date-time } }
    ShiftAuditEventResponse:
      type: object
      properties:
        id: { type: string }
        shiftId: { type: string }
        type: { type: string }
        actorId: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---- Carts / Orders ----
    CreateCartRequest:
      type: object
      properties: { storeId: { type: string } }
      required: [storeId]
    SelectedModifierRequest:
      type: object
      properties: { modifierId: { type: string }, option: { type: string } }
    SelectedModifierResponse:
      type: object
      properties: { modifierId: { type: string }, option: { type: string }, additionalCost: { type: number } }
    DiscountDto:
      type: object
      properties:
        type: { type: string, enum: [PERCENTAGE, FIXED_AMOUNT] }
        value: { type: number }
      required: [type, value]
    AddCartItemRequest:
      type: object
      properties:
        productId: { type: string }
        quantity: { type: integer }
        selectedModifiers: { type: array, items: { $ref: '#/components/schemas/SelectedModifierRequest' }, default: [] }
        discount: { $ref: '#/components/schemas/DiscountDto' }
      required: [productId, quantity]
    UpdateCartItemQuantityRequest:
      type: object
      properties: { quantity: { type: integer } }
      required: [quantity]
    VoidCartItemRequest:
      type: object
      properties: { reason: { type: string, nullable: true } }
    SetCartDiscountRequest:
      type: object
      properties: { discount: { $ref: '#/components/schemas/DiscountDto' } }
    CheckoutRequest:
      type: object
      properties: { idempotencyKey: { type: string } }
      required: [idempotencyKey]
    CartItemResponse:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        taxCategory: { type: string }
        selectedModifiers: { type: array, items: { $ref: '#/components/schemas/SelectedModifierResponse' } }
        discount: { $ref: '#/components/schemas/DiscountDto' }
        lineSubtotal: { type: number }
        lineDiscountAmount: { type: number }
        lineTotal: { type: number }
    TaxBreakdownLineResponse:
      type: object
      properties: { name: { type: string }, ratePercent: { type: number }, amount: { type: number } }
    CartTotalsResponse:
      type: object
      properties:
        subtotal: { type: number }
        itemDiscountTotal: { type: number }
        cartDiscountAmount: { type: number }
        taxableAmount: { type: number }
        taxBreakdown: { type: array, items: { $ref: '#/components/schemas/TaxBreakdownLineResponse' } }
        totalTax: { type: number }
        total: { type: number }
    CartResponse:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        status: { type: string, enum: [OPEN, CHECKED_OUT] }
        items: { type: array, items: { $ref: '#/components/schemas/CartItemResponse' } }
        discount: { $ref: '#/components/schemas/DiscountDto' }
        totals: { $ref: '#/components/schemas/CartTotalsResponse' }
        orderId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentRecordResponse:
      type: object
      properties:
        method: { type: string }
        amount: { type: number }
        reference: { type: string, nullable: true }
        confirmedBy: { type: string, nullable: true }
        confirmedAt: { type: string, format: date-time }
        maskedCardNumber: { type: string, nullable: true }
    RefundLineItemResponse:
      type: object
      properties:
        cartItemId: { type: string }
        quantity: { type: integer }
        amount: { type: number }
        restock: { type: boolean }
    RefundRecordResponse:
      type: object
      properties:
        refundId: { type: string }
        method: { type: string }
        lineItems: { type: array, items: { $ref: '#/components/schemas/RefundLineItemResponse' } }
        amount: { type: number }
        reason: { type: string, nullable: true }
        refundedBy: { type: string, nullable: true }
        refundedAt: { type: string, format: date-time }
    OrderResponse:
      type: object
      properties:
        id: { type: string }
        cartId: { type: string }
        storeId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/CartItemResponse' } }
        discount: { $ref: '#/components/schemas/DiscountDto' }
        totals: { $ref: '#/components/schemas/CartTotalsResponse' }
        idempotencyKey: { type: string }
        checkedOutAt: { type: string, format: date-time }
        currency: { type: string }
        status: { type: string, enum: [PENDING, PAID, PARTIALLY_REFUNDED, REFUNDED] }
        payments: { type: array, items: { $ref: '#/components/schemas/PaymentRecordResponse' } }
        amountPaid: { type: number }
        remainingBalance: { type: number }
        refunds: { type: array, items: { $ref: '#/components/schemas/RefundRecordResponse' } }
        amountRefunded: { type: number }
        remainingRefundable: { type: number }
    OrderEventResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        type: { type: string }
        actorId: { type: string, nullable: true }
        detail: { type: string, nullable: true }
    ConfirmPaymentRequest:
      type: object
      properties:
        method: { type: string }
        amount: { type: number }
        reference: { type: string, nullable: true }
      required: [method, amount]
    RefundLineItemRequest:
      type: object
      properties:
        cartItemId: { type: string }
        quantity: { type: integer }
        restock: { type: boolean, default: false }
      required: [cartItemId, quantity]
    RefundRequest:
      type: object
      properties:
        refundId: { type: string }
        method: { type: string, enum: [CARD, MANUAL] }
        lineItems: { type: array, items: { $ref: '#/components/schemas/RefundLineItemRequest' } }
        reason: { type: string, nullable: true }
      required: [refundId, method, lineItems]

    # ---- Payments ----
    CreatePaymentRequest:
      type: object
      properties:
        orderId: { type: string }
        amount: { type: number }
        currency: { type: string, default: USD }
      required: [orderId, amount]
    PaymentResponse:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        terminalTransactionId: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        declineReason: { type: string, nullable: true }
        refundId: { type: string, nullable: true }
        refundedAmount: { type: number, nullable: true }
        maskedCardNumber: { type: string, nullable: true }
    RefundPaymentRequest:
      type: object
      properties: { refundId: { type: string }, amount: { type: number } }
      required: [refundId, amount]
    RefundAttemptResponse:
      type: object
      properties:
        refundId: { type: string }
        paymentId: { type: string }
        orderId: { type: string }
        amount: { type: number }
        status: { type: string }
        attempts: { type: integer }
        lastError: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    WebhookPayload:
      type: object
      properties:
        eventId: { type: string }
        terminalTransactionId: { type: string }
        outcome: { type: string, enum: [APPROVED, DECLINED] }
        declineReason: { type: string, nullable: true }
      required: [eventId, terminalTransactionId, outcome]

    # ---- Sync ----
    ItemConflictResponse:
      type: object
      properties:
        sku: { type: string, nullable: true }
        reason: { type: string, enum: [PRICE_CHANGED, TAX_CATEGORY_CHANGED, PRODUCT_NOT_FOUND, PAYMENT_MISMATCH, INVALID_SALE] }
        capturedValue: { type: string, nullable: true }
        currentValue: { type: string, nullable: true }
    OfflineSaleConflictResponse:
      type: object
      properties:
        idempotencyKey: { type: string }
        deviceId: { type: string }
        storeId: { type: string }
        outcome: { type: string }
        orderId: { type: string, nullable: true }
        conflicts: { type: array, items: { $ref: '#/components/schemas/ItemConflictResponse' } }
        processedAt: { type: string, format: date-time }
    OfflineSaleModifierRequest:
      type: object
      properties: { modifierId: { type: string }, option: { type: string }, additionalCost: { type: number } }
    OfflineSaleItemRequest:
      type: object
      properties:
        sku: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        unitPriceAtSale: { type: number }
        taxCategoryAtSale: { type: string }
        selectedModifiers: { type: array, items: { $ref: '#/components/schemas/OfflineSaleModifierRequest' }, default: [] }
        discount: { $ref: '#/components/schemas/DiscountDto' }
    OfflineSalePaymentRequest:
      type: object
      properties: { method: { type: string }, amount: { type: number }, reference: { type: string, nullable: true } }
    OfflineSaleRequest:
      type: object
      properties:
        idempotencyKey: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OfflineSaleItemRequest' } }
        discount: { $ref: '#/components/schemas/DiscountDto' }
        payments: { type: array, items: { $ref: '#/components/schemas/OfflineSalePaymentRequest' }, default: [] }
        soldAt: { type: string, format: date-time }
        soldBy: { type: string, nullable: true }
    OfflineSaleBatchRequest:
      type: object
      properties:
        clientId: { type: string }
        clientSecret: { type: string }
        conflictPolicy: { type: string, enum: [REJECT, MAP, CONVERT], default: REJECT }
        sales: { type: array, items: { $ref: '#/components/schemas/OfflineSaleRequest' } }
      required: [clientId, clientSecret, sales]
    OfflineSaleResultResponse:
      type: object
      properties:
        idempotencyKey: { type: string }
        outcome: { type: string }
        orderId: { type: string, nullable: true }
        replayed: { type: boolean }
        conflicts: { type: array, items: { $ref: '#/components/schemas/ItemConflictResponse' } }
    OfflineSaleBatchResponse:
      type: object
      properties: { results: { type: array, items: { $ref: '#/components/schemas/OfflineSaleResultResponse' } } }

    # ---- Printing / Email ----
    RegisterPrinterRequest:
      type: object
      properties:
        storeId: { type: string }
        name: { type: string }
        connectionType: { type: string, enum: [LOCAL, USB, CLOUD] }
      required: [storeId, name, connectionType]
    SetPrinterStatusRequest:
      type: object
      properties: { status: { type: string, enum: [ONLINE, OFFLINE] } }
      required: [status]
    PrinterResponse:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        name: { type: string }
        connectionType: { type: string }
        status: { type: string }
        registeredAt: { type: string, format: date-time }
    PrintReceiptRequest:
      type: object
      properties: { printerId: { type: string } }
      required: [printerId]
    PrintJobResponse:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        printerId: { type: string }
        status: { type: string }
        message: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    EmailReceiptRequest:
      type: object
      properties: { recipient: { type: string } }
      required: [recipient]
    EmailReceiptResponse:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        recipient: { type: string }
        status: { type: string }
        message: { type: string, nullable: true }
        sentAt: { type: string, format: date-time }

    # ---- Reporting ----
    RunPipelineRequest:
      type: object
      properties:
        period: { type: string }
        asOf: { type: string, format: date-time, nullable: true }
        storeIds: { type: array, items: { type: string }, nullable: true }
      required: [period]
    BackfillRequest:
      type: object
      properties:
        period: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        storeIds: { type: array, items: { type: string }, nullable: true }
      required: [period, from, to]
    PipelineRunResponse:
      type: object
      properties:
        id: { type: string }
        period: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        storeIds: { type: array, items: { type: string } }
        status: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    SalesAggregateResponse:
      type: object
      properties:
        storeId: { type: string }
        period: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        orderCount: { type: integer }
        itemsSold: { type: integer }
        grossSales: { type: number }
        discountTotal: { type: number }
        taxCollected: { type: number }
        refundsTotal: { type: number }
        netSales: { type: number }
        generatedAt: { type: string, format: date-time }
    InventoryAggregateResponse:
      type: object
      properties:
        storeId: { type: string }
        period: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        stockCountsPerformed: { type: integer }
        totalVarianceUnits: { type: integer }
        overageCount: { type: integer }
        shortageCount: { type: integer }
        generatedAt: { type: string, format: date-time }
    ProductSalesSummaryResponse:
      type: object
      properties:
        productId: { type: string }
        productName: { type: string }
        quantitySold: { type: integer }
        revenue: { type: number }
    CashOnHandResponse:
      type: object
      properties:
        storeId: { type: string }
        openShiftCount: { type: integer }
        totalExpectedCash: { type: number }
        asOf: { type: string, format: date-time }
    StaffAggregateResponse:
      type: object
      properties:
        storeId: { type: string }
        period: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        shiftsWorked: { type: integer }
        distinctCashiers: { type: integer }
        totalCashVariance: { type: number }
        shiftsWithNote: { type: integer }
        generatedAt: { type: string, format: date-time }

    # ---- Finance Reports ----
    CreateScheduleRequest:
      type: object
      properties:
        storeId: { type: string }
        type: { type: string }
        format: { type: string }
        timezone: { type: string }
        frequency: { type: string }
        recipients: { type: array, items: { type: string } }
      required: [storeId, type, format, timezone, frequency, recipients]
    ScheduledReportResponse:
      type: object
      properties:
        id: { type: string }
        storeId: { type: string }
        type: { type: string }
        format: { type: string }
        timezone: { type: string }
        frequency: { type: string }
        recipients: { type: array, items: { type: string } }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastRunStatus: { type: string, nullable: true }
    ScheduledReportRunResponse:
      type: object
      properties:
        id: { type: string }
        scheduleId: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        runAt: { type: string, format: date-time }
        status: { type: string }
        deliveredTo: { type: array, items: { type: string } }
        failedRecipients: { type: array, items: { type: string } }

    # ---- Backups ----
    BackupMetadataResponse:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        sizeBytes: { type: integer, format: int64 }
        checksumSha256: { type: string }
        status: { type: string }
        validated: { type: boolean }
        errorMessage: { type: string, nullable: true }
    RestoreRequest:
      type: object
      properties: { targetJdbcUrl: { type: string } }
      required: [targetJdbcUrl]
    RestoreDrillResultResponse:
      type: object
      properties:
        id: { type: string }
        backupId: { type: string }
        targetJdbcUrl: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        durationMillis: { type: integer, format: int64 }
        tableRowCounts: { type: object, additionalProperties: { type: integer, format: int64 } }
        rowCountsMatched: { type: boolean }
        status: { type: string }
        errorMessage: { type: string, nullable: true }
