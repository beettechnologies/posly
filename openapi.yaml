openapi: 3.0.3
info:
  title: Posly API
  version: "1.0.0"
  description: |
    HTTP API for the Posly point-of-sale backend (Ktor/Exposed/PostgreSQL).

    This spec is **hand-authored** against the actual route/DTO definitions under
    `server/src/main/kotlin/com/beettechnologies/posly/` (not generated from code annotations),
    covering all 27 route groups. Fully worked request/response examples are provided for the
    highest-traffic flows (auth, cart/checkout, payments/refunds, product/store creation, sales
    reporting, historical sales import, API keys); the remaining endpoints have complete,
    accurate request/response schemas but no worked examples.

    ## Authentication

    Two schemes, both sent as `Authorization: Bearer <value>`, and interchangeable on any route
    that documents both:
    - **User JWT** — obtained from `POST /auth/login` (or `/auth/mfa/verify` / `/auth/sso/callback`).
      Carries the user's roles; most routes gate on one or more of `ADMIN`, `MANAGER`, `CASHIER`,
      `MERCHANDISER`.
    - **API key** — format `posly_<key-id>-<secret>`, obtained from `POST /api-keys` (ADMIN only).
      Carries a narrow set of read-only scopes (`ORDERS_READ`, `PRODUCTS_READ`, `REPORTS_READ`) and
      can only be used on the small subset of routes that explicitly document `apiKeyAuth` below —
      never on write endpoints, and never on the two heavy-analytics pipeline endpoints regardless
      of scope. See `API_KEYS.md` for the full scope table.

    A handful of routes are intentionally unauthenticated by design (not an oversight): device
    pairing/heartbeat (`POST /devices/enroll`, `POST /devices/heartbeat`), offline-sale batch
    ingestion (`POST /sync/offline-sales`, authenticated instead via device client credentials in
    the body), the payment gateway webhook (`POST /payments/webhook`, verified via an HMAC
    signature header instead), and the invite/SSO-callback endpoints where the caller has no token
    yet (`POST /users/accept-invite`, `POST /auth/sso/callback`).
  contact:
    name: Posly Engineering
servers:
  - url: http://localhost:8080
    description: Local development server (./gradlew :server:run)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login, refresh, logout, MFA, SSO callback
  - name: Users
    description: User invitation, roles, status, SSO configuration
  - name: Devices
    description: POS terminal pairing, enrollment, heartbeat
  - name: API Keys
    description: 3rd-party integration credentials
  - name: Secrets
    description: JWT signing key / webhook secret rotation
  - name: Feature Flags
    description: Rollout flags with per-store gating
  - name: Audit
    description: Global audit-log query and retention
  - name: Webhooks
    description: Outbound webhook subscriptions and delivery tracking
  - name: Tax Profiles
    description: Tax profile CRUD
  - name: Products
    description: Product catalog CRUD
  - name: Product Import
    description: Bulk CSV product catalog import
  - name: Sales Import
    description: Historical sales/order CSV import and reconciliation
  - name: Search
    description: Product search (JWT or API key)
  - name: Stores
    description: Store CRUD, branding logo
  - name: Tax
    description: Tax calculation
  - name: Inventory
    description: Stock levels, adjustments, reservations
  - name: Stock Counts
    description: Physical stock count / variance reconciliation
  - name: Shifts
    description: Cashier shift open/close, cash reconciliation
  - name: Carts
    description: Shopping cart lifecycle and checkout
  - name: Orders
    description: Order query, payment confirmation, refunds (JWT or API key for reads)
  - name: Payments
    description: Card payment gateway integration and webhook
  - name: Sync
    description: Offline sale batch ingestion and conflict review
  - name: Printing
    description: Printer registration and receipt print jobs
  - name: Email
    description: Emailed receipts
  - name: Reporting
    description: Sales/inventory/staff aggregates and the analytics pipeline (JWT or API key for reads)
  - name: Finance Reports
    description: Scheduled/on-demand finance report generation and delivery
  - name: Backups
    description: Database backup and restore drills
paths:
  # ============================================================
  # Auth
  # ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with username/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: "cashier", password: "cashier123" }
      responses:
        '200':
          description: Tokens issued, or MFA required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              examples:
                success:
                  value: { accessToken: "eyJraWQi...", refreshToken: "eyJraWQi..." }
                mfaRequired:
                  value: { mfaRequired: true, mfaToken: "eyJraWQi..." }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '204': { description: Logged out }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete login by verifying an MFA code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
            example: { mfaToken: "eyJraWQi...", code: "123456" }
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaVerifyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sso/callback:
    post:
      tags: [Auth]
      summary: Complete an SSO login / JIT-provisioning flow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SsoCallbackRequest' }
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoLoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "No role mapped for this SSO assertion", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { description: "SSO not configured or disabled", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /protected/me:
    get:
      tags: [Auth]
      summary: Returns the caller's own identity/roles from the JWT
      responses:
        '200':
          description: Caller identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }

  # ============================================================
  # Users
  # ============================================================
  /users:
    get:
      tags: [Users]
      summary: List all users (ADMIN)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UserResponse' } }
  /users/invite:
    post:
      tags: [Users]
      summary: Invite a new user (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteUserRequest' }
      responses:
        '201':
          description: User invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteUserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/accept-invite:
    post:
      tags: [Users]
      summary: Redeem an invite token and set the new user's password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
      responses:
        '204': { description: Password set }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/audit-log:
    get:
      tags: [Users]
      summary: Query the auth-related audit log (ADMIN)
      parameters:
        - { name: username, in: query, schema: { type: string } }
        - { name: event, in: query, schema: { type: string } }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditLogEntryResponse' } }
  /users/sso/configure:
    post:
      tags: [Users]
      summary: Configure the SSO role-mapping rules (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SsoConfigureRequest' }
      responses:
        '200':
          description: SSO configuration saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoConfigurationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /users/sso/configuration:
    get:
      tags: [Users]
      summary: Fetch the current SSO configuration (ADMIN)
      responses:
        '200':
          description: SSO configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoConfigurationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}:
    get:
      tags: [Users]
      summary: Fetch a single user (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/roles:
    patch:
      tags: [Users]
      summary: Change a user's assigned roles (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRolesRequest' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/store-access:
    patch:
      tags: [Users]
      summary: Change which stores a user can access (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStoreAccessRequest' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Change a user's status, e.g. disable an account (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStatusRequest' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/UserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # Devices
  # ============================================================
  /devices:
    get:
      tags: [Devices]
      summary: List registered devices (ADMIN/MANAGER)
      parameters:
        - { name: storeId, in: query, schema: { type: string } }
      responses:
        '200': { description: Devices, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeviceResponse' } } } } }
  /devices/create-pair-code:
    post:
      tags: [Devices]
      summary: Generate a device pairing code for a store (ADMIN/MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePairCodeRequest' }
      responses:
        '201': { description: Pair code created, content: { application/json: { schema: { $ref: '#/components/schemas/PairCodeResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /devices/validate-pair-code:
    post:
      tags: [Devices]
      summary: Validate a pairing code without consuming it (ADMIN/MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidatePairCodeRequest' }
      responses:
        '200': { description: Validation result, content: { application/json: { schema: { $ref: '#/components/schemas/ValidatePairCodeResponse' } } } }
  /devices/revoke-pair-code:
    post:
      tags: [Devices]
      summary: Revoke an outstanding pairing code (ADMIN/MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokePairCodeRequest' }
      responses:
        '200': { description: Revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/enroll:
    post:
      tags: [Devices]
      summary: Redeem a pairing code to enroll a new device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollDeviceRequest' }
      responses:
        '200': { description: Device enrolled, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollDeviceResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/heartbeat:
    post:
      tags: [Devices]
      summary: Record a device liveness heartbeat
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
      responses:
        '200': { description: Heartbeat recorded, content: { application/json: { schema: { $ref: '#/components/schemas/HeartbeatResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Deprovisioned, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /devices/{id}:
    get:
      tags: [Devices]
      summary: Fetch a single device (ADMIN/MANAGER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Device, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/{id}/deprovision:
    post:
      tags: [Devices]
      summary: Deprovision (revoke) a device (ADMIN/MANAGER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Deprovisioned, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # API Keys
  # ============================================================
  /api-keys:
    post:
      tags: [API Keys]
      summary: Create a new API key (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKeyRequest' }
            example: { name: "Accounting integration", scopes: ["ORDERS_READ"] }
      responses:
        '201':
          description: Key created - the raw secret is shown exactly once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreatedResponse' }
              example:
                apiKey: { id: "key-1", name: "Accounting integration", keyPrefix: "a1b2c3d4", scopes: ["ORDERS_READ"], status: "ACTIVE", createdAt: "2026-01-01T00:00:00Z", updatedAt: "2026-01-01T00:00:00Z" }
                rawKey: "posly_key-1-s3cr3tvalue"
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [API Keys]
      summary: List all API keys, without raw secrets (ADMIN)
      responses:
        '200': { description: Keys, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApiKeyResponse' } } } } }
  /api-keys/{id}/revoke:
    post:
      tags: [API Keys]
      summary: Revoke an API key, effective immediately (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Revoked, content: { application/json: { schema: { $ref: '#/components/schemas/ApiKeyResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api-keys/{id}/rotate:
    post:
      tags: [API Keys]
      summary: Rotate an API key - old secret stops working immediately (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Rotated - the new raw secret is shown exactly once, content: { application/json: { schema: { $ref: '#/components/schemas/ApiKeyCreatedResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api-keys/{id}/usage:
    get:
      tags: [API Keys]
      summary: List recent usage records for an API key (ADMIN)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Usage log, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApiKeyUsageResponse' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # Secrets
  # ============================================================
  /ops/secrets:
    get:
      tags: [Secrets]
      summary: List managed secrets with current/historical versions (ADMIN)
      responses:
        '200': { description: Secrets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SecretSummaryResponse' } } } } }
  /ops/secrets/{name}/rotate:
    post:
      tags: [Secrets]
      summary: Rotate a secret to a new version (ADMIN)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [jwt-signing-key, payment-webhook-secret] }
      responses:
        '200': { description: Rotated - new plaintext value shown once, content: { application/json: { schema: { $ref: '#/components/schemas/SecretRotationResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # Feature Flags
  # ============================================================
  /feature-flags:
    post:
      tags: [Feature Flags]
      summary: Create a new feature flag (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFeatureFlagRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Feature Flags]
      summary: List all feature flags (ADMIN)
      responses:
        '200': { description: Flags, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeatureFlagResponse' } } } } }
  /feature-flags/audit-log:
    get:
      tags: [Feature Flags]
      summary: Query feature-flag audit-log entries (ADMIN)
      parameters:
        - { name: event, in: query, schema: { type: string } }
      responses:
        '200': { description: Audit entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditLogEntryResponse' } } } } }
  /feature-flags/{key}:
    patch:
      tags: [Feature Flags]
      summary: Update a flag's enabled state / rollout / store allowlist (ADMIN)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFeatureFlagRequest' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /feature-flags/{key}/evaluate:
    get:
      tags: [Feature Flags]
      summary: Evaluate whether a flag is enabled for a store (any authenticated role)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: storeId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Evaluation result, content: { application/json: { schema: { $ref: '#/components/schemas/FlagEvaluationResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================
  # Audit
  # ============================================================
  /ops/audit-log:
    get:
      tags: [Audit]
      summary: Query the global audit log (ADMIN)
      parameters:
        - { name: username, in: query, schema: { type: string } }
        - { name: event, in: query, schema: { type: string } }
        - { name: correlationId, in: query, schema: { type: string } }
      responses:
        '200': { description: Audit entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditLogEntryResponse' } } } } }
  /ops/audit/retention/run-now:
    post:
      tags: [Audit]
      summary: Trigger an immediate audit-log retention/purge run (ADMIN)
      responses:
        '200': { description: Retention run result, content: { application/json: { schema: { $ref: '#/components/schemas/AuditRetentionResultResponse' } } } }

  # ============================================================
  # Webhooks
  # ============================================================
  /webhooks/subscriptions:
    post:
      tags: [Webhooks]
      summary: Register a new webhook subscription (ADMIN/MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterWebhookRequest' }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSubscriptionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Webhooks]
      summary: List all webhook subscriptions (ADMIN/MANAGER)
      responses:
        '200': { description: Subscriptions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WebhookSubscriptionResponse' } } } } }
  /webhooks/subscriptions/{id}:
    get:
      tags: [Webhooks]
      summary: Fetch a single webhook subscription (ADMIN/MANAGER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Subscription, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSubscriptionResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: List webhook delivery attempts (ADMIN/MANAGER)
      parameters:
        - { name: subscriptionId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Deliveries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WebhookDeliveryResponse' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /webhooks/deliveries/dead-letter:
    get:
      tags: [Webhooks]
      summary: List deliveries that exhausted retries (ADMIN/MANAGER)
      responses:
        '200': { description: Dead-lettered deliveries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WebhookDeliveryResponse' } } } } }

  # ============================================================
  # Tax Profiles
  # ============================================================
  /tax-profiles:
    post:
      tags: [Tax Profiles]
      summary: Create a tax profile with rate lines (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaxProfileRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TaxProfileResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Tax Profiles]
