        '404': { $ref: '#/components/responses/NotFound' }
  /products/import/{fileId}/start:
    post:
      tags: [Product Import]
      summary: Start (execute) the product import job (ADMIN/MANAGER/MERCHANDISER)
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportMappingRequest' }
      responses:
        '201': { description: Job started, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJobResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
