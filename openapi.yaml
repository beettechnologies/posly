  # ============================================================
  # Sales Import
  # ============================================================
  /sales-import/upload:
    post:
      tags: [Sales Import]
      summary: Upload a historical-sales CSV file staged for import (ADMIN/MANAGER)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSalesCsvResponse' }
              example:
                fileId: "f1a2b3c4-0000-0000-0000-000000000001"
                headers: ["orderRef", "storeId", "sku", "qty", "unitPrice", "soldAt", "paymentMethod", "total"]
                previewRows: [["ORD-1", "store-1", "SKU-1", "1", "10.00", "2024-01-01T00:00:00Z", "CASH", "10.00"]]
                totalRows: 1
        '400': { $ref: '#/components/responses/BadRequest' }
  /sales-import/{fileId}/dry-run:
    post:
      tags: [Sales Import]
      summary: Preview grouped historical orders and their import eligibility (ADMIN/MANAGER)
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesImportMappingRequest' }
            example:
              mapping:
                ORDER_REFERENCE: orderRef
                STORE_ID: storeId
                SKU: sku
                QUANTITY: qty
                UNIT_PRICE: unitPrice
                SOLD_AT: soldAt
                PAYMENT_METHOD: paymentMethod
                TOTAL_AMOUNT: total
      responses:
        '200':
          description: Dry-run report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesDryRunResponse' }
              example:
                rowOutcomes: [ { rowNumber: 1, orderReference: "ORD-1", result: "MATCHED", sku: "SKU-1", errors: [] } ]
                groups: [ { orderReference: "ORD-1", rowNumbers: [1], importable: true, itemCount: 1, total: 10.0, errors: [] } ]
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sales-import/{fileId}/start:
    post:
      tags: [Sales Import]
      summary: Start (execute) the historical sales import job (ADMIN/MANAGER)
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesImportMappingRequest' }
      responses:
        '201': { description: Job started, content: { application/json: { schema: { $ref: '#/components/schemas/SalesImportJobResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sales-import/jobs/{jobId}:
    get:
      tags: [Sales Import]
      summary: Get the status/result of a sales import job (ADMIN/MANAGER)
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/SalesImportJobResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /sales-import/jobs/{jobId}/reconciliation:
    get:
      tags: [Sales Import]
      summary: Fetch the reconciliation report for a completed import (ADMIN/MANAGER)
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Reconciliation report, content: { application/json: { schema: { $ref: '#/components/schemas/SalesReconciliationReportResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sales-import/jobs/{jobId}/rollback:
    post:
      tags: [Sales Import]
      summary: Roll back a completed sales import job (ADMIN/MANAGER)
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Rolled back, content: { application/json: { schema: { $ref: '#/components/schemas/SalesImportJobResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

