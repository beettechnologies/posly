    post:
      tags: [Shifts]
      summary: Close a shift, computing expected cash and variance (ADMIN/MANAGER/CASHIER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseShiftRequest' }
      responses:
        '200': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/ShiftResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Not open, or variance exceeds threshold without note/override", content: { application/json: { schema: { $ref: '#/components/schemas/RequiresOverrideOrNoteResponse' } } } }
