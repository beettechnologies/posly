      summary: List a shift's discrepancy/override audit trail (ADMIN/MANAGER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Audit events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShiftAuditEventResponse' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # Carts
  # ============================================================
  /carts:
    post:
      tags: [Carts]
      summary: Create a new open cart for a store (ADMIN/MANAGER/CASHIER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCartRequest' }
            example: { storeId: "store-1" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /carts/{id}:
    get:
      tags: [Carts]
      summary: Fetch a cart with computed totals (ADMIN/MANAGER/CASHIER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /carts/{id}/items:
    post:
      tags: [Carts]
      summary: Add a line item to an open cart (ADMIN/MANAGER/CASHIER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
            example: { productId: "9f2b7e3a-1234-4c56-8d90-abcdef123456", quantity: 2 }
      responses:
        '200':
          description: Item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /carts/{id}/items/{itemId}:
    patch:
      tags: [Carts]
      summary: Update the quantity of a cart line item (ADMIN/MANAGER/CASHIER)
      parameters:
        - { $ref: '#/components/parameters/PathId' }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemQuantityRequest' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Carts]
      summary: Remove/void an item from an open cart (ADMIN/MANAGER/CASHIER)
      parameters:
        - { $ref: '#/components/parameters/PathId' }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoidCartItemRequest' }
      responses:
        '200': { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /carts/{id}/discount:
    put:
      tags: [Carts]
      summary: Set or clear the cart-level discount (ADMIN/MANAGER/CASHIER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCartDiscountRequest' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CartResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /carts/{id}/checkout:
    post:
      tags: [Carts]
      summary: Convert a cart into an order (idempotent) (ADMIN/MANAGER/CASHIER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
            example: { idempotencyKey: "a1b2c3d4-e5f6-7890-abcd-ef1234567890" }
      responses:
        '201':
          description: Order created (or 200 if this idempotencyKey was already processed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ============================================================
  # Orders
  # ============================================================
  /orders:
    get:
      tags: [Orders]
      summary: List orders for a store within a time range (ADMIN/MANAGER, or API key scope ORDERS_READ)
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - { name: storeId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderResponse' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Fetch a single order (ADMIN/MANAGER/CASHIER, or API key scope ORDERS_READ)
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/events:
    get:
      tags: [Orders]
      summary: List an order's audit/event trail (ADMIN/MANAGER/CASHIER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OrderEventResponse' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/payments:
    post:
      tags: [Orders]
      summary: Confirm/record a manual payment against a pending order (ADMIN/MANAGER/CASHIER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPaymentRequest' }
            example: { method: "CASH", amount: 42.50 }
      responses:
        '200':
          description: Payment confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/refund:
    post:
      tags: [Orders]
      summary: Refund an order via card gateway or manual method, optionally restocking (ADMIN/MANAGER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
            example:
              refundId: "refund-a1b2c3"
              method: "MANUAL"
              lineItems: [ { cartItemId: "item-1", quantity: 1, restock: true } ]
              reason: "Customer changed their mind"
      responses:
        '200':
          description: Refunded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { description: Payment gateway error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  # ============================================================
  # Payments
  # ============================================================
  /payments:
    post:
      tags: [Payments]
      summary: Create a card payment against an order via the payment gateway (ADMIN/MANAGER/CASHIER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Gateway error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /payments/{id}:
    get:
      tags: [Payments]
      summary: Fetch a payment (ADMIN/MANAGER/CASHIER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund a gateway payment directly (ADMIN/MANAGER)
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPaymentRequest' }
      responses:
        '200': { description: Refunded, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { description: Gateway error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /payments/refunds/unresolved:
    get:
      tags: [Payments]
      summary: List refund attempts stuck in an ambiguous gateway state (ADMIN/MANAGER)
      responses:
        '200': { description: Unresolved refund attempts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RefundAttemptResponse' } } } } }
  /payments/webhook:
    post:
      tags: [Payments]
      summary: Payment gateway/terminal webhook callback (HMAC-signed, not JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
      responses:
        '200': { description: Processed (or already-processed), content: { application/json: { schema: { $ref: '#/components/schemas/PaymentResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ============================================================
  # Sync
  # ============================================================
  /sync/conflicts:
    get:
      tags: [Sync]
      summary: List offline-sale sync conflicts awaiting review (ADMIN/MANAGER)
      responses:
        '200': { description: Conflicts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OfflineSaleConflictResponse' } } } } }
  /sync/offline-sales:
    post:
      tags: [Sync]
      summary: Ingest a batch of offline POS sales from a device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfflineSaleBatchRequest' }
      responses:
        '200': { description: Batch processed, content: { application/json: { schema: { $ref: '#/components/schemas/OfflineSaleBatchResponse' } } } }
