      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPrinterRequest' }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/PrinterResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Printing]
      summary: List printers, optionally filtered by store (ADMIN/MANAGER/CASHIER)
      parameters:
        - { name: storeId, in: query, schema: { type: string } }
      responses:
        '200': { description: Printers, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PrinterResponse' } } } } }
  /printers/{id}/status:
    patch:
      tags: [Printing]
      summary: Update a printer's online/offline status (ADMIN/MANAGER)
